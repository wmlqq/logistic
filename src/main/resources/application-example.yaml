# Copy to application-local.yaml (gitignored) or set environment variables.
# See README for setup steps.

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mylogistic?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: your_mysql_password
  jpa:
    show-sql: true

app:
  jwt:
    secret: replace-with-a-long-random-secret-at-least-32-chars

dingtalk:
  robot:
    webhook: https://oapi.dingtalk.com/robot/send?access_token=YOUR_TOKEN

logistic:
  backup:
    directory: C:/logistic_backups
