server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yaml
  application:
    name: logistic
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mylogistic?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-use-a-random-string-at-least-32-characters}
    expiration-days: ${APP_JWT_EXPIRATION_DAYS:7}

dingtalk:
  robot:
    webhook: ${DINGTALK_ROBOT_WEBHOOK:}

logistic:
  backup:
    directory: ${LOGISTIC_BACKUP_DIR:${user.home}/.logistic/backups}
